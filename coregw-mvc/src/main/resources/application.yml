spring:
  application:
    name: coregw-mvc
  profiles:
    default: [platform, resilient, redis-bench]
  threads:
    virtual:
      enabled: false
  http:
    codecs:
      max-in-memory-size: 1MB
server:
  port: ${PORT:8080}
  tomcat:
    mbeanregistry:
      enabled: true
    threads:
      max: 1000
      min-spare: 10
gateway:
  order-redis:
    ttl: ${ORDER_REDIS_TTL:1h}
  core-url: ${CORE_URL:http://localhost:9090}
  core-path: ${CORE_PATH:/orders}
  max-connections: ${CORE_MAX_CONNECTIONS:1000}
  acquire-timeout: ${CORE_ACQUIRE_TIMEOUT:100ms}
  connect-timeout: ${CORE_CONNECT_TIMEOUT:1s}
  response-timeout: ${CORE_RESPONSE_TIMEOUT:3s}
  resilience-enabled: true
  max-concurrent-calls: ${CORE_MAX_CONCURRENT_CALLS:1000}
  window-size: 100
  minimum-calls: 50
  failure-rate: 50
  open-wait: 10s
  half-open-calls: 10
  expose-thread-model: false
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${DEPLOYMENT_ENVIRONMENT:local}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        jvm.gc.pause: true
      minimum-expected-value:
        http.server.requests: 100us
        jvm.gc.pause: 100us
      maximum-expected-value:
        http.server.requests: 5s
        jvm.gc.pause: 10s
  endpoint:
    health:
      show-details: never
logging:
  level:
    reactor.netty.http.client: ERROR

# Reusable RedisTemplate configuration. Enable independently of the benchmark profile.
app:
  redis:
    enabled: ${REDIS_ENABLED:true}
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    database: ${REDIS_DATABASE:0}
    username: ${REDIS_USERNAME:}
    password: ${REDIS_PASSWORD:}
    ssl: ${REDIS_SSL:false}
    mode: ${REDIS_MODE:pool} # multiplexing or pool
    command-timeout: 1s
    connect-timeout: 1s
    pool:
      max-active: 8
      max-idle: 8
      min-idle: 0
      max-wait: 1s
redis-bench:
  keys: 10000
  payload-bytes: 1024
